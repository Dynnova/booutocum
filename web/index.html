<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cosplay List</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0f0f14;
    color: #e0e0e0;
    font-family: 'Segoe UI', sans-serif;
    min-height: 100vh;
  }

  header {
    background: #1a1a2e;
    border-bottom: 1px solid #2a2a4a;
    padding: 16px 24px;
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }

  header h1 {
    font-size: 20px;
    color: #7289da;
    white-space: nowrap;
  }

  .search-bar {
    flex: 1;
    min-width: 200px;
    display: flex;
    gap: 8px;
  }

  .search-bar input {
    flex: 1;
    background: #2a2a3e;
    border: 1px solid #3a3a5a;
    border-radius: 8px;
    padding: 8px 14px;
    color: #e0e0e0;
    font-size: 14px;
    outline: none;
    transition: border-color .2s;
  }

  .search-bar input:focus { border-color: #7289da; }

  .stats {
    font-size: 13px;
    color: #888;
    white-space: nowrap;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 12px;
    padding: 20px;
  }

  .card {
    background: #1a1a2e;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid #2a2a4a;
    transition: transform .15s, border-color .15s;
    cursor: pointer;
  }

  .card:hover {
    transform: translateY(-3px);
    border-color: #7289da;
  }

  .card-img {
    width: 100%;
    aspect-ratio: 3/4;
    object-fit: cover;
    display: block;
    background: #2a2a3e;
  }

  .card-img.loading {
    background: linear-gradient(90deg, #2a2a3e 25%, #3a3a5e 50%, #2a2a3e 75%);
    background-size: 200% 100%;
    animation: shimmer 1.2s infinite;
  }

  @keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  .card-body {
    padding: 8px 10px;
  }

  .card-name {
    font-size: 12px;
    font-weight: 600;
    color: #e0e0e0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .card-sub {
    font-size: 11px;
    color: #888;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 2px;
  }

  .card-footer {
    display: flex;
    gap: 6px;
    padding: 0 10px 10px;
  }

  .btn-copy {
    flex: 1;
    background: #7289da;
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 5px 8px;
    font-size: 11px;
    cursor: pointer;
    transition: background .15s;
  }

  .btn-copy:hover { background: #5a6fd4; }
  .btn-copy.copied { background: #43b581; }

  .btn-link {
    background: #2a2a4a;
    color: #aaa;
    border: none;
    border-radius: 6px;
    padding: 5px 8px;
    font-size: 11px;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    transition: background .15s;
  }

  .btn-link:hover { background: #3a3a5a; color: #e0e0e0; }

  .pagination {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    padding: 20px;
    flex-wrap: wrap;
  }

  .page-btn {
    background: #2a2a4a;
    color: #e0e0e0;
    border: 1px solid #3a3a5a;
    border-radius: 6px;
    padding: 6px 14px;
    cursor: pointer;
    font-size: 13px;
    transition: background .15s;
  }

  .page-btn:hover:not(:disabled) { background: #7289da; border-color: #7289da; }
  .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .page-btn.active { background: #7289da; border-color: #7289da; }

  .page-info { color: #888; font-size: 13px; }

  .empty {
    text-align: center;
    padding: 60px 20px;
    color: #555;
    font-size: 16px;
  }

  .loader {
    text-align: center;
    padding: 60px;
    color: #7289da;
    font-size: 14px;
  }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: #43b581;
    color: #fff;
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 14px;
    opacity: 0;
    transform: translateY(10px);
    transition: all .2s;
    pointer-events: none;
    z-index: 999;
  }

  .toast.show { opacity: 1; transform: translateY(0); }
</style>
</head>
<body>

<header>
  <h1>🎭 Cosplay List</h1>
  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="Cari nama, karakter, series..." autocomplete="off">
  </div>
  <span class="stats" id="stats">Loading...</span>
</header>

<div class="grid" id="grid">
  <div class="loader">⏳ Memuat data...</div>
</div>

<div class="pagination" id="pagination"></div>
<div class="toast" id="toast">✅ Disalin!</div>

<script>
let currentPage = 1;
let totalItems = 0;
let searchQuery = '';
const LIMIT = 48;
let searchTimeout;

async function loadData(page = 1, search = '') {
  const grid = document.getElementById('grid');
  grid.innerHTML = '<div class="loader">⏳ Memuat...</div>';

  try {
    const res = await fetch(`/api/cosplay?page=${page}&limit=${LIMIT}&search=${encodeURIComponent(search)}`);
    const { rows, total } = await res.json();

    totalItems = total;
    currentPage = page;

    document.getElementById('stats').textContent = `${total.toLocaleString()} cosplay`;
    renderGrid(rows);
    renderPagination(page, Math.ceil(total / LIMIT));
  } catch (err) {
    grid.innerHTML = `<div class="empty">❌ Gagal load data: ${err.message}</div>`;
  }
}

function renderGrid(rows) {
  const grid = document.getElementById('grid');

  if (!rows.length) {
    grid.innerHTML = '<div class="empty" style="grid-column:1/-1">😢 Tidak ada hasil</div>';
    return;
  }

  grid.innerHTML = rows.map(item => {
    const coser = escHtml(item.coser || 'Unknown');
    const sub = escHtml(item.character || item.parody || '');
    const photos = item.photo_count > 0 ? `${item.photo_count}P` : '';
    const copyName = item.coser || item.title || 'Unknown';

    return `
      <div class="card">
        <img class="card-img loading" src="${item.cover_url}"
          alt="${coser}"
          loading="lazy"
          onload="this.classList.remove('loading')"
          onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 3 4%22><rect width=%223%22 height=%224%22 fill=%22%232a2a3e%22/></svg>'">
        <div class="card-body">
          <div class="card-name">${coser} ${photos ? `<span style="color:#888;font-weight:400">[${photos}]</span>` : ''}</div>
          ${sub ? `<div class="card-sub">${sub}</div>` : ''}
        </div>
        <div class="card-footer">
          <button class="btn-copy" onclick="copyName(this, ${JSON.stringify(copyName)})">📋 Copy</button>
          <a class="btn-link" href="${item.page_url}" target="_blank">🔗</a>
        </div>
      </div>
    `;
  }).join('');
}

function renderPagination(page, totalPages) {
  const el = document.getElementById('pagination');
  if (totalPages <= 1) { el.innerHTML = ''; return; }

  const pages = [];
  const range = 2;

  pages.push(1);
  if (page - range > 2) pages.push('...');
  for (let i = Math.max(2, page - range); i <= Math.min(totalPages - 1, page + range); i++) pages.push(i);
  if (page + range < totalPages - 1) pages.push('...');
  if (totalPages > 1) pages.push(totalPages);

  el.innerHTML = `
    <button class="page-btn" onclick="loadData(${page - 1}, searchQuery)" ${page <= 1 ? 'disabled' : ''}>◀</button>
    ${pages.map(p => p === '...'
      ? `<span class="page-info">...</span>`
      : `<button class="page-btn ${p === page ? 'active' : ''}" onclick="loadData(${p}, searchQuery)">${p}</button>`
    ).join('')}
    <button class="page-btn" onclick="loadData(${page + 1}, searchQuery)" ${page >= totalPages ? 'disabled' : ''}>▶</button>
    <span class="page-info">${page} / ${totalPages}</span>
  `;
}

function copyName(btn, name) {
  navigator.clipboard.writeText(name).then(() => {
    btn.textContent = '✅ Copied!';
    btn.classList.add('copied');
    showToast(`Disalin: ${name}`);
    setTimeout(() => {
      btn.textContent = '📋 Copy';
      btn.classList.remove('copied');
    }, 2000);
  });
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = `✅ ${msg}`;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function escHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Search debounce
document.getElementById('searchInput').addEventListener('input', e => {
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(() => {
    searchQuery = e.target.value.trim();
    loadData(1, searchQuery);
  }, 400);
});

// Init
loadData(1);
</script>
</body>
</html>
